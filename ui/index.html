<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord Data Analyzer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══════════════ Landing Page ═══════════════ -->
<div id="landing" class="landing">
  <div class="landing-icon"><img src="Logo.png" alt="Logo"></div>
  <h1>Discord Data Analyzer</h1>
  <p>Drop your Discord GDPR ZIP to get started</p>

  <div id="dropzone" class="dropzone" tabindex="0">
    <div class="dropzone-icon">📂</div>
    <div class="dropzone-label">Drop ZIP here<br>or click to select</div>
  </div>

  <button id="selectBtn" class="btn btn-primary">Select ZIP File</button>
  <button id="importBtn" class="btn btn-secondary">Import Analysis</button>
  <button id="continueBtn" class="btn btn-secondary" style="display:none;">Continue last analysis</button>

  <div id="statusMsg" style="margin-top:var(--sp-lg);color:var(--color-dim);font-size:var(--fs-sm);display:none;"></div>
</div>

<!-- ═══════════════ Loading Overlay ═══════════════ -->
<div id="loading" class="loading-overlay hidden">
  <ul id="progressList" class="progress-list">
    <li id="phase-extract" class="progress-item">Extracting ZIP...</li>
    <li id="phase-messages" class="progress-item">Analyzing messages...</li>
    <li id="phase-voice" class="progress-item">Analyzing voice...</li>
    <li id="phase-dashboard" class="progress-item">Building dashboard...</li>
  </ul>
</div>

<!-- ═══════════════ Dashboard ═══════════════ -->
<div id="dashboard" class="dashboard" style="display:none;">
  <header class="dashboard-header">
    <div class="dashboard-header-left">
      <span class="logo-icon"><img src="Logo.png" alt="Logo"></span>
      <h1>Dashboard</h1>
    </div>
    <button id="exportBtn" class="btn btn-secondary btn-sm">Export as JSON</button>
    <button id="newAnalysisBtn" class="btn btn-secondary btn-sm">New Analysis</button>
  </header>

  <div class="dashboard-body">
    <div class="dashboard-body-inner">

      <!-- Summary Cards -->
      <div id="summaryGrid" class="summary-grid"></div>

      <div id="leaderboardGrid" class="leaderboard-grid">
        <div id="dmSection" class="section"></div>
        <div id="serversSection" class="section"></div>
      </div>

      <!-- Voice Section -->
      <div id="voiceSection" class="section"></div>

      <!-- Timeline Section -->
      <div id="timelineSection" class="section"></div>

      <!-- Month Drill‑down (shown when a timeline bar is clicked) -->
      <div id="drilldownSection" style="display:none;">
        <div id="drilldownHeader" class="drilldown-header">
          <button id="drilldownBackBtn" class="btn btn-secondary btn-sm">← Back to Overview</button>
          <span id="drilldownTitle" class="drilldown-title"></span>
        </div>
        <div id="drilldownDayChart" class="section"></div>
        <div id="drilldownGrid" class="leaderboard-grid">
          <div id="drilldownDM" class="section"></div>
          <div id="drilldownServers" class="section"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Tooltip singleton -->
<div id="tooltip" class="timeline-tooltip"></div>

<script src="app.js"></script>
</body>
</html>
