name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyinstaller pywebview

      - name: Build EXE
        run: pyinstaller --onefile --windowed --add-data "ui/index.html;ui" --add-data "ui/style.css;ui" --add-data "ui/app.js;ui" --hidden-import api --hidden-import analyzers --hidden-import analyzers.messages --hidden-import analyzers.voice --hidden-import utils --hidden-import utils.parser --hidden-import utils.formatting --hidden-import tkinter --name "Discord-Data-Analyzer" main.py

      - name: Verify EXE exists
        shell: bash
        run: ls -la dist/Discord-Data-Analyzer.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/Discord-Data-Analyzer.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Discord-Data-Analyzer.exe
          generate_release_notes: true
