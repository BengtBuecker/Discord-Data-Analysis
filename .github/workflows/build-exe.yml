name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyinstaller pywebview

      - name: Build EXE
        run: pyinstaller Discord-Personal-Data-Analyzer.spec

      - name: Verify EXE exists
        shell: bash
        run: ls -la dist/Discord-Personal-Data-Analyzer.exe

      - name: Self-test the built EXE
        shell: bash
        run: ./dist/Discord-Personal-Data-Analyzer.exe --self-test

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/Discord-Personal-Data-Analyzer.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Discord-Personal-Data-Analyzer.exe
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-pre') || contains(github.ref, '-rc') || contains(github.ref, '-alpha') || contains(github.ref, '-beta') }}
